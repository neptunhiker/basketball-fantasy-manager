{% extends "partials/modal.html" %}

{% block modal_title %}Create a profile first{% endblock %}

{% block modal_content %}
  <p>You need a manager profile before you can create a roster.</p>
  <div class="modal-actions">
    <button type="button" @click="$dispatch('close-modal')" class="btn btn-secondary">
      Cancel
    </button>
    <button type="button"
            hx-get="{% url 'fantasy:manager-create' %}"
            hx-target="#modal-root"
            hx-swap="innerHTML"
            class="btn btn-primary">
      Create manager profile
    </button>
  </div>
{% endblock %}
