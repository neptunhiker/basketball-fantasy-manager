{% load i18n %}
{% comment %}
  How many games are coming up in the next seven days, as a round badge that
  gets stronger with the count: four or more stands out in green, none fades.
  Context: n, the count (the caller shows a dash when there is none).
{% endcomment %}
<span class="inline-flex h-7 min-w-7 items-center justify-center rounded-full px-2 text-xs font-semibold tabular-nums
             {% if n >= 4 %}bg-emerald-100 text-emerald-800 ring-1 ring-inset ring-emerald-600/20 dark:bg-emerald-500/15 dark:text-emerald-300 dark:ring-emerald-400/30
             {% elif n == 3 %}bg-primary-50 text-primary-700 ring-1 ring-inset ring-primary-600/15 dark:bg-primary-500/15 dark:text-primary-300 dark:ring-primary-400/30
             {% elif n == 0 %}text-neutral-400 dark:text-neutral-500
             {% else %}bg-neutral-100 text-neutral-700 dark:bg-neutral-800 dark:text-neutral-300{% endif %}"
      title="{% blocktranslate count count=n %}{{ count }} game in the next 7 days{% plural %}{{ count }} games in the next 7 days{% endblocktranslate %}">{{ n }}</span>
