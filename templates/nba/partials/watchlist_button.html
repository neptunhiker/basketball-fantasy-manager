<button type="button"
        hx-post="{% url 'nba:watchlist-toggle' player.slug %}{% if remove_row %}?remove_row=1{% endif %}"
        hx-swap="{% if remove_row %}outerHTML{% else %}outerHTML{% endif %}"
        {% if remove_row %}hx-target="closest tr"{% endif %}
        class="inline-flex h-8 w-8 items-center justify-center rounded-lg transition focus:outline-none focus:ring-2 focus:ring-primary-500/40 {% if is_watched %}text-primary-600 hover:bg-primary-50 dark:text-primary-300 dark:hover:bg-primary-500/10{% else %}text-neutral-300 hover:bg-neutral-100 hover:text-primary-600 dark:text-neutral-600 dark:hover:bg-neutral-800 dark:hover:text-primary-300{% endif %}"
        aria-label="{% if is_watched %}Remove {{ player.full_name }} from watchlist{% else %}Add {{ player.full_name }} to watchlist{% endif %}"
        title="{% if is_watched %}Remove from watchlist{% else %}Add to watchlist{% endif %}">
  <svg class="h-5 w-5" {% if is_watched %}fill="currentColor"{% else %}fill="none"{% endif %} stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="m12 3.8 2.5 5.1 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8L12 3.8Z"/>
  </svg>
</button>
