{# Renders one bound form field with label, errors and help text. #}
<div class="{{ wrapper_class|default:'' }}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="flex items-start gap-2.5">
      {{ field }}
      <span class="text-sm text-tertiary-700 dark:text-neutral-200">{{ field.label }}</span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="form-label">
      {{ field.label }}{% if field.field.required %}<span class="text-primary-500" aria-hidden="true"> *</span>{% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}<p class="form-help">{{ field.help_text }}</p>{% endif %}
  {% for error in field.errors %}<p class="form-error">{{ error }}</p>{% endfor %}
</div>
