{% load i18n %}
{% comment %}
  A small ⓘ button that opens a short explanation. Works by tap, click and
  keyboard, unlike a `title` tooltip, which touch screens never show.
  Context: text (the explanation), label (what it explains, for screen readers).
{% endcomment %}
<span x-data="{ open: false }" class="relative inline-flex align-middle normal-case tracking-normal"
      @keydown.escape.stop="open = false">
  <button type="button" @click.stop.prevent="open = !open" @click.outside="open = false" :aria-expanded="open"
          class="inline-flex h-4 w-4 items-center justify-center rounded-full text-neutral-400 transition hover:text-primary-600 focus-visible:outline focus-visible:outline-2 focus-visible:outline-primary-500 dark:hover:text-primary-300"
          aria-label="{% blocktranslate %}What is {{ label }}?{% endblocktranslate %}">
    <svg class="h-3.5 w-3.5" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 11v5M12 8h.01"/>
    </svg>
  </button>
  <span x-show="open" x-cloak x-transition.opacity.duration.100ms role="tooltip"
        class="absolute right-0 top-6 z-30 w-64 rounded-lg border border-neutral-200 bg-white p-3 text-left text-xs font-normal leading-relaxed text-neutral-700 shadow-lg dark:border-neutral-700 dark:bg-neutral-900 dark:text-neutral-200">
    {{ text }}
  </span>
</span>
