{% load i18n %}
{% translate "Switch to light theme" as light_theme_label %}
{% translate "Switch to dark theme" as dark_theme_label %}
<button type="button"
        x-data="{
          dark: document.documentElement.classList.contains('dark'),
          toggle() {
            this.dark = !this.dark;
            document.documentElement.classList.toggle('dark', this.dark);
            localStorage.setItem('theme', this.dark ? 'dark' : 'light');
          }
        }"
        @click="toggle()"
        class="btn btn-ghost h-9 w-9 !px-0"
        :aria-label="dark ? '{{ light_theme_label }}' : '{{ dark_theme_label }}'">
  <svg x-show="!dark" x-cloak class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
    <path stroke-linecap="round" stroke-linejoin="round" d="M21.75 15.5A9.25 9.25 0 1 1 8.5 2.25a7.75 7.75 0 0 0 13.25 13.25Z"/>
  </svg>
  <svg x-show="dark" x-cloak class="h-4 w-4" fill="none" stroke="currentColor" stroke-width="1.7" viewBox="0 0 24 24" aria-hidden="true">
    <circle cx="12" cy="12" r="4"/>
    <path stroke-linecap="round" d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
  </svg>
</button>
